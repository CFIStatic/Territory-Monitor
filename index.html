<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3C/svg%3E"
    />
    <title>Territory Monitor — restoration market map</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brandmark">
          <span class="dot" aria-hidden="true"></span>
          <h1>Territory Monitor</h1>
          <span class="subtitle">Restoration market coverage</span>
        </div>

        <div class="topbar-search">
          <input
            id="search"
            type="search"
            placeholder="Search territory, owner, ZIP, city, county…"
            autocomplete="off"
            aria-label="Search territories"
          />
          <div id="search-results" class="search-results" hidden></div>
        </div>

        <div class="topbar-right">
          <div id="data-status" class="data-status"></div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">◐</button>
        </div>
      </header>

      <div class="body">
        <aside class="sidebar" id="sidebar">
          <section class="control-group">
            <h2>Color by</h2>
            <div class="segmented" role="radiogroup" aria-label="Color mode">
              <button type="button" data-mode="brand" class="active" role="radio" aria-checked="true">Brand</button>
              <button type="button" data-mode="owner" role="radio" aria-checked="false">Owner</button>
              <button type="button" data-mode="saturation" role="radio" aria-checked="false">Saturation</button>
            </div>
            <p class="hint" id="mode-hint"></p>
          </section>

          <section class="control-group">
            <h2>Layers</h2>
            <label class="check"><input type="checkbox" id="layer-territories" checked /> Territory areas</label>
            <label class="check"><input type="checkbox" id="layer-labels" checked /> Territory labels</label>
            <label class="check"><input type="checkbox" id="layer-zips" /> Member ZIP centroids</label>
            <label class="check"><input type="checkbox" id="layer-contested" /> Contested ZIPs</label>
            <label class="check"><input type="checkbox" id="layer-whitespace" /> Whitespace (uncovered)</label>
          </section>

          <section class="control-group">
            <div class="group-head">
              <h2 id="legend-title">Brands</h2>
              <button type="button" class="link-btn" id="filter-all">all</button>
            </div>
            <div id="legend" class="legend"></div>
          </section>

          <section class="control-group" id="warnings-group" hidden>
            <h2>Build warnings</h2>
            <ul id="warnings" class="warnings"></ul>
          </section>
        </aside>

        <main class="map-wrap">
          <div id="map"></div>
          <div id="map-empty" class="map-empty" hidden>No territories match the current filters.</div>
        </main>

        <aside class="panel" id="panel"></aside>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
